[project]
name = "zdl-backend"
version = "0.1.0"
description = "Zero Day Librarian backend tool service"
authors = [{name = "Project Maintainers", email = "info@example.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "ruff>=0.3",
  "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
