[pytest]
# Zero Day Librarian test config (repo root).
# Tests import the `backend` package, so the repo root must be on sys.path.
pythonpath = .
testpaths = backend/tests
python_files = test_*.py
addopts = -v
markers =
    agent: slow end-to-end agent behavioral tests. Route tool calls through the
        live gateway -> Lambda -> CockroachDB. Requires AGENTCORE_INVOKE=1,
        working AWS credentials, and gateway connectivity. Skipped by default.
        Run the fast suite with:  pytest -m "not agent"
